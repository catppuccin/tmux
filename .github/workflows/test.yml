---
name: Tests
permissions:
  contents: read
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "assets/**"
  push:
    paths-ignore:
      - "*.md"
      - "assets/**"
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Install tmux
        run: sudo apt update && sudo apt install -y --allow-downgrades tmux=3.4-1build1
      - uses: actions/checkout@v6
      - name: Run Tests
        shell: bash
        run: |
          bash --version
          tmux -V
          ./run_tests.sh

  # Advisory canary against tmux's default branch; non-blocking by design.
  tmux-latest:
    name: Test (tmux latest)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Build tmux from default branch
        run: |
          sudo apt update
          sudo apt install -y libevent-dev libncurses-dev bison autoconf automake pkg-config build-essential
          git clone --depth 1 https://github.com/tmux/tmux.git /tmp/tmux-src
          cd /tmp/tmux-src
          sh autogen.sh
          ./configure
          make
          sudo make install
      - uses: actions/checkout@v6
      - name: Run Tests
        shell: bash
        run: |
          bash --version
          tmux -V
          ./run_tests.sh
